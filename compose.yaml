# PostgreSQL and MySQL for the test suite: docker compose up -d
services:
  pgsql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kaly_tasks
      POSTGRES_USER: kaly
      POSTGRES_PASSWORD: kaly
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kaly_tasks
      MYSQL_USER: kaly
      MYSQL_PASSWORD: kaly
      MYSQL_ROOT_PASSWORD: kaly
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
